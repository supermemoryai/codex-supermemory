name: Hook Path Regression Tests

on:
  pull_request:
    paths:
      - src/**
      - test/hook-paths.mjs
      - build.mjs
      - package.json
      - package-lock.json
      - .github/workflows/hook-paths.yml

jobs:
  hook-paths:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node --test test/hook-paths.mjs
